# XcodeGen 工程描述文件
# 作用：不用手工建 Xcode 工程，一条命令自动生成 .xcodeproj
# 生成命令：xcodegen generate

name: XstreeIOS

options:
  bundleIdPrefix: com.xstreecompat
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO
    TARGETED_DEVICE_FAMILY: "1,2"

targets:

  # ---------------------------------------------------------------
  # 1) 容器 App：iOS 上 Safari 扩展必须包在一个 App 里
  #
  # 注意：Info.plist 用仓库里手写的文件，不再让 XcodeGen 生成。
  # 原因：XcodeGen 生成的 plist 缺少 iOS 扩展必需的键，
  #      会让 ValidateEmbeddedBinary 报
  #      "Couldn't load Info dictionary for ...appex" 而编译失败。
  # ---------------------------------------------------------------
  XstreeIOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xstreecompat.k7m3q9
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: XstreeIOSExtension
        embed: true

  # ---------------------------------------------------------------
  # 2) Safari 网页扩展本体：Swift 壳 + Resources 里的 manifest/JS
  # ---------------------------------------------------------------
  XstreeIOSExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
        excludes:
          - "Resources"
          - "Info.plist"
      - path: Extension/Resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xstreecompat.k7m3q9.Extension
        INFOPLIST_FILE: Extension/Info.plist
        GENERATE_INFOPLIST_FILE: NO

# -------------------------------------------------------------------
# 显式声明一个共享 scheme：XcodeGen 不会自动生成 scheme，
# 而 CI 里的 xcodebuild -scheme 必须能找到它，否则直接失败。
# -------------------------------------------------------------------
schemes:
  XstreeIOS:
    build:
      targets:
        XstreeIOS: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
