name: Build unsigned iOS IPA

# 没有 Mac 也能用：GitHub 免费提供 macOS 机器帮你编译
# 用法：把这个仓库上传到 GitHub（public 仓库免费不限时长），
#       然后到 Actions 页面点 Run workflow，跑完下载 XstreeIOS-unsigned.ipa

# 手动 / 脚本触发。刻意不用 on: push ——
# 否则逐个文件上传时每个 commit 都会触发一次 macOS 构建，白白排队。
on:
  workflow_dispatch:

jobs:
  build:
    # macos-latest 会自动指向 GitHub 当前提供的最新 macOS 运行器，
    # 避免写死版本号后运行器退役导致构建失败
    runs-on: macos-latest
    steps:
      - name: 取出仓库代码
        uses: actions/checkout@v4

      - name: 查看编译环境
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 安装 XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen || brew install --quiet xcodegen

      - name: 生成 Xcode 工程
        run: |
          xcodegen --version
          xcodegen generate
          ls -la
          echo "--- 工程里可用的 scheme / target ---"
          xcodebuild -project XstreeIOS.xcodeproj -list

      - name: 编译（不签名；ValidateEmbeddedBinary 误报时以产物完整性为准）
        run: |
          LIST=$(xcodebuild -project XstreeIOS.xcodeproj -list 2>/dev/null || true)
          SCHEMES_PART="${LIST#*Schemes:}"
          set +e
          if [[ "$SCHEMES_PART" == *XstreeIOS* ]]; then
            echo "==> 用 scheme 构建"
            xcodebuild \
              -project XstreeIOS.xcodeproj \
              -scheme XstreeIOS \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              VALIDATE_PRODUCT=NO \
              build
          else
            echo "==> 没有找到 scheme，退回用 target 构建"
            xcodebuild \
              -project XstreeIOS.xcodeproj \
              -target XstreeIOS \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              VALIDATE_PRODUCT=NO \
              build
          fi
          RC=$?
          set -e
          echo "xcodebuild 退出码: $RC"
          if [ "$RC" -eq 0 ]; then
            echo "==> 编译完全成功"
            exit 0
          fi

          APP_DIR="build/Build/Products/Release-iphoneos/XstreeIOS.app"
          APPEX_DIR="$APP_DIR/PlugIns/XstreeIOSExtension.appex"
          echo "==> 逐项检查产物（未签名构建下 ValidateEmbeddedBinary 会误报）"
          ok=1
          [ -f "$APP_DIR/Info.plist" ]                 || { echo "  缺 App/Info.plist"; ok=0; }
          [ -f "$APP_DIR/XstreeIOS" ]                  || { echo "  缺 App 可执行文件"; ok=0; }
          [ -f "$APPEX_DIR/Info.plist" ]               || { echo "  缺 appex/Info.plist"; ok=0; }
          [ -f "$APPEX_DIR/XstreeIOSExtension" ]       || { echo "  缺 appex 可执行文件"; ok=0; }
          [ -f "$APPEX_DIR/Resources/manifest.json" ]  || { echo "  缺 appex/Resources/manifest.json"; ok=0; }
          if [ "$ok" -eq 1 ]; then
            echo "==> 产物完整 —— 这次失败只是签名校验步骤的误报，继续打包 ipa"
            exit 0
          fi
          echo "==> 产物不完整，判定为真正的构建失败"
          exit "$RC"

      - name: 诊断信息（编译失败时自动打印）
        if: failure()
        run: |
          echo "===== 1. 扩展 appex 目录内容 ====="
          find build/Build/Products/Release-iphoneos/XstreeIOSExtension.appex -maxdepth 3 2>/dev/null || echo "appex 不存在"
          echo "===== 2. appex/Info.plist 是否存在 ====="
          ls -la build/Build/Products/Release-iphoneos/XstreeIOSExtension.appex/Info.plist 2>&1 || true
          echo "===== 3. appex/Info.plist 实际内容 ====="
          plutil -p build/Build/Products/Release-iphoneos/XstreeIOSExtension.appex/Info.plist 2>&1 || true
          echo "===== 4. App 的 PlugIns 目录 ====="
          find build/Build/Products/Release-iphoneos/XstreeIOS.app/PlugIns -maxdepth 3 2>/dev/null || echo "PlugIns 不存在"
          echo "===== 5. PlugIns 里 appex 的 Info.plist ====="
          plutil -p build/Build/Products/Release-iphoneos/XstreeIOS.app/PlugIns/XstreeIOSExtension.appex/Info.plist 2>&1 || true
          echo "===== 6. 仓库里的 Extension/Info.plist 源码 ====="
          cat Extension/Info.plist
          echo "===== 7. 扩展 target 的关键构建设置 ====="
          xcodebuild -project XstreeIOS.xcodeproj -target XstreeIOSExtension -showBuildSettings 2>/dev/null | grep -Ei 'INFOPLIST|MACH_O_TYPE|PRODUCT_BUNDLE_PACKAGE_TYPE|PRODUCT_MODULE_NAME|EXECUTABLE_NAME|WRAPPER_EXTENSION|GENERATE_INFO|SKIP_INSTALL|APPLICATION_EXTENSION' || true
          echo "===== 8. App target 的关键构建设置 ====="
          xcodebuild -project XstreeIOS.xcodeproj -target XstreeIOS -showBuildSettings 2>/dev/null | grep -Ei 'INFOPLIST|PRODUCT_BUNDLE_IDENTIFIER|WRAPPER_EXTENSION' || true

      - name: 打包成 ipa（XML plist + ad-hoc 签名，兼容第三方签名工具）
        run: |
          set -e
          echo "==> 查找编译产物"
          APP_PATH=$(find . -type d -name "XstreeIOS.app" -not -path "*/Index.noindex/*" | head -n 1)
          echo "找到: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "没有找到 XstreeIOS.app，下面列出 build 目录结构以便排查："
            find . -maxdepth 6 -type d | head -n 60
            exit 1
          fi
          APPEX_PATH="$APP_PATH/PlugIns/XstreeIOSExtension.appex"

          echo "==> 1) 把 Info.plist 转成 XML 格式"
          echo "    （很多第三方签名工具解析不了 Xcode 默认的二进制 plist）"
          plutil -convert xml1 "$APP_PATH/Info.plist"
          plutil -convert xml1 "$APPEX_PATH/Info.plist"
          echo "--- App Info.plist 前几行 ---"
          head -n 6 "$APP_PATH/Info.plist"
          echo "--- appex Info.plist 前几行 ---"
          head -n 6 "$APPEX_PATH/Info.plist"

          echo "==> 2) 给扩展和主程序做 ad-hoc 签名，生成 _CodeSignature"
          echo "    （否则工具会报 Info.plist 或签名已被修改）"
          codesign --force --sign - --timestamp=none "$APPEX_PATH" || echo "  appex ad-hoc 签名失败（不致命，工具会重签）"
          codesign --force --sign - --timestamp=none "$APP_PATH"   || echo "  app ad-hoc 签名失败（不致命，工具会重签）"
          echo "--- appex 签名信息 ---"
          codesign -dv "$APPEX_PATH" 2>&1 | head -n 12 || true
          echo "--- appex 是否有 _CodeSignature ---"
          ls -la "$APPEX_PATH/_CodeSignature" 2>&1 || true

          echo "==> 3) 打包"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry XstreeIOS-unsigned.ipa Payload
          ls -la XstreeIOS-unsigned.ipa
          echo "--- ipa 内条目 ---"
          unzip -l XstreeIOS-unsigned.ipa | head -n 30

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: XstreeIOS-unsigned-ipa
          path: XstreeIOS-unsigned.ipa
          if-no-files-found: error
